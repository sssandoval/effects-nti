<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0e">
    <title>Effects NTI · Soundboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.myinstants.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#board">Pular para os pads</a>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>
                <div class="brand-text">
                    <h1 class="logo">Effects <span>NTI</span></h1>
                    <p class="tagline">soundboard</p>
                </div>
            </div>

            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <label for="search" class="sr-only">Buscar efeito</label>
                <input type="search" id="search" placeholder="Buscar efeito..." autocomplete="off" spellcheck="false">
                <kbd class="search-kbd" aria-hidden="true">/</kbd>
                <button type="button" class="search-clear" id="search-clear" aria-label="Limpar busca" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="control-bar">
        <div class="filters" role="tablist" aria-label="Filtrar pads">
            <button type="button" role="tab" class="filter is-active" data-filter="all" aria-selected="true">
                Todos <span class="filter-count" id="count-all">0</span>
            </button>
            <button type="button" role="tab" class="filter" data-filter="favorites" aria-selected="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
                Favoritos <span class="filter-count" id="count-favorites">0</span>
            </button>
            <button type="button" role="tab" class="filter" data-filter="recent" aria-selected="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><polyline points="12 7.5 12 12 15 14"/></svg>
                Recentes <span class="filter-count" id="count-recent">0</span>
            </button>
        </div>

        <div class="control-actions">
            <p class="result-info" id="result-info" aria-live="polite"></p>
            <button type="button" class="stop-all" id="stop-all" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                Parar tudo
            </button>
        </div>
    </div>

    <main class="board" id="board" tabindex="-1">
        <!-- os pads são gerados por sounds.js a partir da lista "sounds" -->
    </main>

    <div class="empty-state" id="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>
        <p class="empty-title" id="empty-title">Nenhum efeito encontrado</p>
        <p class="empty-text" id="empty-text">Tente outro termo de busca.</p>
        <button type="button" class="empty-action" id="empty-action">Ver todos os efeitos</button>
    </div>

    <footer class="site-footer">
        <p>Effects NTI</p>
        <p class="footer-hint">
            <kbd>/</kbd> buscar
            <span aria-hidden="true">·</span>
            <kbd>Esc</kbd> limpar
            <span aria-hidden="true">·</span>
            <kbd>S</kbd> parar tudo
        </p>
    </footer>

    <script src="sounds.js"></script>
</body>
</html>
