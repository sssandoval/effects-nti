<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effects NTI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="led-row">
            <span class="led on"></span>
            <span class="led on"></span>
            <span class="led on"></span>
            <span class="led on"></span>
            <span class="led"></span>
        </div>
        <h1 class="logo">EFFECTS <span>NTI</span></h1>
        <p class="tagline">soundboard</p>
    </header>

    <div class="control-bar">
        <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search" placeholder="buscar efeito..." autocomplete="off">
        </div>
        <span class="count-badge"><b id="pad-count">0</b> pads</span>
    </div>

    <main class="board" id="board">
        <!-- os cards são gerados por sounds.js a partir da lista abaixo -->
    </main>

    <footer class="site-footer">
        <p>Effects NTI</p>
    </footer>

    <script src="sounds.js"></script>
</body>
</html>
